# Perfil de grande porte (padrão). Use --preset lite para o perfil leve 32x32.
image_channels: 3
image_resolution: [256, 256]
base_channels: 128
unet_res_blocks: 3
downsample_factor: 2
num_timesteps: 1000
generation_steps: 50
time_embedding_dim: 768
guidance_scale: 7.5
condition_dropout: 0.1
text_vocab_size: 256
max_prompt_length: 512
text_encoder_layers: 12
attention_heads: 16
vision_enabled: true
vision_patch_size: 16
vision_layers: 8
vision_input_resolution: 224
max_reference_images: 4
reference_dropout: 0.5
